name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore solution
        run: dotnet restore FanDemo.sln

      - name: Build solution
        run: dotnet build FanDemo.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test FanDemo.Tests/FanDemo.Tests.csproj --configuration Release --no-build
